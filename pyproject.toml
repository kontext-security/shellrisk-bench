[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shellrisk-bench"
version = "0.1.0"
description = "A reproducible benchmark for context-free shell-command risk classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Kontext", email = "security@kontext.security"}]
dependencies = [
  "datasets>=3.0",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/kontext-security/shellrisk-bench"
Issues = "https://github.com/kontext-security/shellrisk-bench/issues"

[tool.setuptools.packages.find]
include = ["shellrisk_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

